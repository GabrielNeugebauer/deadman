# Pyth price-pusher config (scripts/pyth_pusher_start.sh): the feeds Pyth
# does not sponsor on Solana, pushed to their shard-0 push-oracle accounts so
# Deadman's PriceFeed registry (tool/set_price_feed.dart) reads a fresh price
# when a plan pays its release fee in SKR. SOL/USD and USDC/USD are
# sponsored (Pyth keeps them fresh) and are not listed.
#
# The program accepts a price up to the registered max age (600 s by
# default, tool/set_price_feed.dart): push at least every 120 s, sooner on a
# 0.5% move. Both feeds go in one batch; each push is a few transactions
# paid by kora/pyth-pusher-key.json.
