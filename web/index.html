<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`. Must start and end with "/". -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!--
    No inline or foreign script except CanvasKit (gstatic) and the
    SRI-pinned @solana/web3.js (jsdelivr); 'wasm-unsafe-eval' only lets
    CanvasKit compile its WebAssembly.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Deadman: the safety net for your self-custody. Check in, and if you go silent your crypto still ends up where you decided.">
  <meta name="theme-color" content="#0A0B0D">
  <meta name="color-scheme" content="dark">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Deadman">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Deadman</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0A0B0D; }
  </style>
</head>
<body>
  <!--
    Wallets: Phantom and Solflare are found through the Wallet Standard
    (raw transaction bytes). If a wallet only injects its legacy provider,
    lib/wallet/web_wallet_backend_js.dart loads @solana/web3.js on demand,
    pinned with SRI, to hand it a VersionedTransaction.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
